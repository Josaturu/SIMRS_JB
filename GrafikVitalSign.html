<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grafik Vital Sign</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7ff;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .logo {
      display: flex;
      align-items: center;
    }
    .logo img {
      height: 70px;
      margin-right: 15px;
    }
    .sticker-box {
      border: 2px dashed #396cf0;
      height: 80px;
      width: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-style: italic;
      color: #666;
      background: #fafbff;
      text-align: center;
      font-size: 13px;
    }

    /* Title */
    .title {
      text-align: center;
      color: #396cf0;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0 20px 0;
    }

    /* Card */
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      max-width: 1100px;
      margin: auto;
      margin-bottom: 20px;
    }

    .form-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      color: #396cf0;
      margin-bottom: 5px;
      display: block;
      font-size: 13px;
    }

    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #396cf0;
      box-shadow: 0 0 6px rgba(57,108,240,0.4);
      outline: none;
    }

    .button-container {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-add {
      background: #396cf0;
      color: white;
    }
    .btn-add:hover {
      background: #2d55c7;
      box-shadow: 0px 4px 10px rgba(57,108,240,0.3);
    }
    .btn-reset {
      background: #e63946;
      color: white;
    }
    .btn-reset:hover {
      background: #b92d38;
      box-shadow: 0px 4px 10px rgba(230,57,70,0.3);
    }

    .chart-wrapper {
      max-width: 1100px;
      margin: 20px auto;
    }

    canvas {
      width: 100% !important;
      height: 400px !important; /* tinggi diperbesar */
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 10px;
      display: block;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.05);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      width: 320px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease;
    }
    .modal-content h3 {
      margin-bottom: 20px;
      color: #333;
      font-size: 16px;
    }
    .modal-content button { margin: 5px; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Time Form */
    .time-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px 20px;
    }
    .time-form label {
      font-weight: bold;
      color: #396cf0;
      margin-bottom: 5px;
      font-size: 13px;
      display: block;
    }
    .time-form input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
    }
    .time-form .full {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg" alt="Logo Rumah Sakit">
      <div>
        <strong>Rumah Sakit Umum</strong><br>
        <span style="color:#396cf0; font-weight:bold;">PRASETYA BUNDA</span>
      </div>
    </div>
    <div class="sticker-box">
      Tempelkan Stiker Identitas Pasien
    </div>
  </div>

  <!-- Title -->
  <div class="title">📋 Catatan Sedasi & Anestesi</div>

  <!-- Card Utama -->
  <div class="card">

    <!-- Form Input Vital -->
    <div class="form-container">
      <div><label>Respirasi (R)</label><input type="number" id="resp"></div>
      <div><label>Nadi (N)</label><input type="number" id="nadi"></div>
      <div><label>TD Sistolik</label><input type="number" id="sistolik"></div>
      <div><label>TD Diastolik</label><input type="number" id="diastolik"></div>
      <div><label>SPO₂ (%)</label><input type="number" id="spo2"></div>
    </div>

    <!-- Tombol -->
    <div class="button-container">
      <button class="btn-reset" onclick="openModal()">Reset Data</button>
      <button class="btn-add" onclick="tambahData()">Tambah Data</button>
    </div>

    <!-- Grafik -->
    <div class="chart-wrapper">
      <canvas id="chartVital"></canvas>
    </div>

    <!-- Form Waktu -->
    <div class="time-form" style="margin-top:20px;">
      <div><label>Mulai Anestesi</label><input type="time"></div>
      <div><label>Selesai Anestesi</label><input type="time"></div>
      <div><label>Mulai Pembedahan</label><input type="time"></div>
      <div><label>Selesai Pembedahan</label><input type="time"></div>
      <div class="full"><label>Keterangan</label><input type="text"></div>
      <div><label>Induksi Pukul</label><input type="time"></div>
      <div><label>Pasien Siap Insisi</label><input type="time"></div>
      <div><label>Insisi Mulai Pukul</label><input type="time"></div>
      <div><label>Operasi Mulai Pukul</label><input type="time"></div>
      <div><label>Ekstubasi Pukul</label><input type="time"></div>
      <div><label>Pasien Keluar OK</label><input type="time"></div>
    </div>
  </div>

  <!-- Modal Konfirmasi -->
  <div id="resetModal" class="modal">
    <div class="modal-content">
      <h3>Yakin ingin mereset semua data?</h3>
      <button class="btn-reset" onclick="confirmReset()">Ya, Reset</button>
      <button class="btn-add" onclick="closeModal()">Batal</button>
    </div>
  </div>

  <script>
    let labels = [];
    let dataResp = [], dataNadi = [], dataSistolik = [], dataDiastolik = [], dataSpo2 = [];

    const ctx = document.getElementById('chartVital').getContext('2d');
    const chartVital = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Resp (R)', data: dataResp, borderColor: '#396cf0', backgroundColor: '#396cf0', tension: 0.3 },
          { label: 'Nadi (N)', data: dataNadi, borderColor: '#e63946', backgroundColor: '#e63946', tension: 0.3 },
          { label: 'TD Sistolik', data: dataSistolik, borderColor: '#2a9d8f', backgroundColor: '#2a9d8f', tension: 0.3 },
          { label: 'TD Diastolik', data: dataDiastolik, borderColor: '#f4a261', backgroundColor: '#f4a261', tension: 0.3 },
          { label: 'SPO₂', data: dataSpo2, borderColor: '#6a4c93', backgroundColor: '#6a4c93', tension: 0.3 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { 
          title: { display: true, text: 'Grafik Vital Sign (Real-Time)', color: '#396cf0', font: { size: 16 } },
          legend: { position: 'bottom' }
        },
        scales: { 
          y: { beginAtZero: true }, 
          x: { title: { display: true, text: 'Waktu (HH:MM:SS)', color: '#396cf0' } } 
        }
      }
    });

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('id-ID', { hour12: false });
    }

    function tambahData() {
      labels.push(getCurrentTime());
      dataResp.push(document.getElementById('resp').value || null);
      dataNadi.push(document.getElementById('nadi').value || null);
      dataSistolik.push(document.getElementById('sistolik').value || null);
      dataDiastolik.push(document.getElementById('diastolik').value || null);
      dataSpo2.push(document.getElementById('spo2').value || null);
      chartVital.update();
      document.querySelectorAll(".form-container input").forEach(i => i.value = "");
    }

    function openModal() { document.getElementById('resetModal').style.display = "flex"; }
    function closeModal() { document.getElementById('resetModal').style.display = "none"; }

    function confirmReset() {
      labels.length = 0;
      dataResp.length = 0;
      dataNadi.length = 0;
      dataSistolik.length = 0;
      dataDiastolik.length = 0;
      dataSpo2.length = 0;
      chartVital.update();
      closeModal();
    }
  </script>
</body>
</html>
